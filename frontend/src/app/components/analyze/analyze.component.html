<app-nav-bar [title]="form.title" [backUrl]="'viewForm'">
    <button mat-icon-button [routerLink]="['/view_instances']"
                            [state]="{data: form}"
                            [disabled]="!form.isInstancied">
        <mat-icon>list</mat-icon>
    </button>
</app-nav-bar>
<div class="analyze-container">
    <h4 class="title"> Statistics</h4>
    <div >
    @if(form) {
    <form [formGroup]="frm">
    <mat-form-field class="select-div">
        <mat-select [formControl]="selectedQuestionCtl" [placeholder]="currentQuestion?.title || ''">
            @for(question of form.questions; track $index) {
                <mat-option [value]="question">{{question.title}}</mat-option>
            }
            
        </mat-select>
        
    </mat-form-field>
    </form>
    }
    </div>
    <div class="table">
        @if(currentQuestion) {
        <table mat-table [dataSource]="dataSource">
            <ng-container matColumnDef="Answer">
                <th mat-header-cell *matHeaderCellDef>Answer</th>
                <td mat-cell *matCellDef="let row">{{row.value ? row.value : 'no value'}}</td>
            </ng-container>
            <ng-container matColumnDef="Count">
                <th mat-header-cell *matHeaderCellDef>Count</th>
                <td mat-cell *matCellDef="let row">{{row.count}}</td>
            </ng-container>
            <ng-container matColumnDef="Ratio">
                <th mat-header-cell *matHeaderCellDef>Ratio</th>
                <td mat-cell *matCellDef="let row">{{row.ratio}}%</td>
            </ng-container>
         <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
        }
    </div>
</div>
