<h2 mat-dialog-title>Delete OptionList</h2>
<mat-dialog-content>
    Are you sure you want to delete this option list?

</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button (click)="cancel()">No</button>
    <button mat-button (click)="confirmDelete()">Yes</button>
</mat-dialog-actions>
