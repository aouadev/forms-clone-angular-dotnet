<app-nav-bar title="Welcome to My Forms App!" class="toolbar-actions">

</app-nav-bar>
<div class="body">
<h2>Sign in</h2>
<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="row col-3">
    <div class="form-group mb-3">
        <label for="email">Email</label>
        <input #email type="email" formControlName="email" class="form-controll" [ngClass]="{ 'is-invalid': submitted && f.email.errors}"/>
        @if (submitted && f.email.hasError('required')) {
            <div class="invalid-feeback">Email is required</div>
        }
    </div>
    <div class="form-group mb-3">
        <label for="password">Password</label>
        <input type="password" formControlName="password" class="form-control" [ngClass]="{ 'is-invalid': submitted && f.password.errors }"/>
        @if (submitted && f.password.hasError('required')) {
            <div class="invalid-feedback">Password is required</div>
        }
    </div>
    <div class="form-group mb-3">
        <button [disabled]="loading" class="btn btn-primary">Login</button>
        @if (loading) {
            <img class="pl-2" src=""/>
        }
    </div>
    @if (error) {
        <div class="form-group mb-3">
            <div class="alert alert-danger">{{error}}</div>
        </div>
    }
    
</form>
</div>
