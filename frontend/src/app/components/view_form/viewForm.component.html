<mat-toolbar>
    <button mat-icon-button>
        <mat-icon (click)="arrowBack()">arrow_back_ios</mat-icon>
    </button>
    <span classe="title">{{form.title}}</span>
    <span class="spacer"></span>
    <button mat-icon-button>
        <mat-icon (click)="arrowBack()">edit</mat-icon>
    </button>
    <button mat-icon-button>
        <mat-icon (click)="arrowBack()">delete</mat-icon>
    </button>
    <button mat-icon-button>
        <mat-icon (click)="arrowBack()">share</mat-icon>
    </button>

</mat-toolbar>
<div class="body-container">
    @if(form) {
    <div class="form-info">
        <div class="form-info-line">
                <div class="form-info-label">Title:</div>
                <div class="form-info-data"> {{form.title}}</div>
        </div> 
        <div class="form-info-line">
            <div class="form-info-label">Description:</div>
            <div class="form-info-data">{{form.description}}</div>
        </div> 
        <div class="form-info-line">
            <div class="form-info-label">Owner:</div>
            
            <div class="form-info-data">{{owner?.firstName}} {{owner?.lastName}}</div>
            
            
        </div> 
        <div class="form-info-line">
            <div class="form-info-label">Public:</div>
            <div class="form-info-data"><mat-slide-toggle [checked]="form.isPublic"></mat-slide-toggle></div>
        </div> 
    </div>
    <div class="questions-container">
    <h4>Questions</h4>
        @for(question of form.questions; track question.id) {
          
            <view-question-card [question]="question"></view-question-card>
          
        }
    
</div>
    }
</div>
