<h2 mat-dialog-title>Delete Question</h2>
<mat-dialog-content>
    Are you sure you want to delete this question: "{{data.questionTitle}}"?
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button (click)="cancel()">No</button>
    <button mat-button (click)="confirmDelete()">Yes</button>
</mat-dialog-actions>
