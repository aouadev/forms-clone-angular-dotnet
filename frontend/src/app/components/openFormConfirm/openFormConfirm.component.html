<h2 mat-dialog-title>Open Form</h2>
<mat-dialog-content>
    You have already answered this form.What do you want to do?
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button (click)="openInstance(true)">Read</button>
    <button mat-button (click)="openInstance(false)">Respond </button>
    <button mat-button mat-dialog-close>Cancel</button>
</mat-dialog-actions>
